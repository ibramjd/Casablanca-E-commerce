{% extends 'store/main.html' %}
{% load static %}
{% block content %}

  <!-- reset password style -->
  <link rel="stylesheet" type="text/css" href="{% static 'css/reset_password.css' %}">
  <div class="reset-password-header">
    <h2>تعيين كلمة مرور جديدة</h2>
    <form class="reset-password-form" method="post">
      {% csrf_token %}
      <div class="password"><h5>أدخل كلمة المرور الجديدة</h5>{{ form.new_password1 }}</div>
      <div class="password"><h5>أعد إدخال كلمة المرور الجديدة</h5>{{ form.new_password2 }}</div>
      <button class="btn btn-success" type="submit">تغيير كلمة المرور</button>
    </form>
  </div>
{% endblock %}
