{% extends 'store/main.html' %}
{% load static %}
{% block content %}

<!-- checkout style -->
<link rel="stylesheet" type="text/css" href="{% static 'css/checkout.css' %}">

<div class="checkout-content">
        
    <div class="checkout-box" id="form-wrapper">
        <form method="POST" id="form" action="{% url 'checkout' %}">
            {% csrf_token %}
            <div id="shipping-info">
                <h5 class="title">معلومات التوصيل</h5>
                <div class="form-field checkout-form-field">
                    <i class="fa fa-phone"></i>
                    <input required class="form-control" type="text" name="phone_number" placeholder="رقم الهاتف">
                </div>
                <div class="form-field checkout-form-field">
                    <!-- <input required class="form-control" type="text" name="state" placeholder="الولاية">  -->
                    <i class="fa fa-map-marker-alt"></i>
                    <select class="form-field checkout-form-field" name="state">
                        <option value="">الولاية</option>
                        <option value="Gadaref">القضارف</option>
                        <option value="Khartoum">الخرطوم</option>
                        <option value="Al Jazirah">الجزيرة</option>
                        <option value="Kassala">كسلا</option>
                        <option value="Red Sea">البحر الأحمر</option>
                        <option value="River Nile">نهر النيل</option>
                        <option value="Northern">الشمالية</option>
                        <option value="North Kordofan">شمال كردفان</option>
                        <option value="South Kordofan">جنوب كردفان</option>
                        <option value="West Kordofan">غرب كردفان</option>
                        <option value="North Darfur">شمال دارفور</option>
                        <option value="South Darfur">جنوب دارفور</option>
                        <option value="East Darfur">شرق دارفور</option>
                        <option value="Central Darfur">وسط دارفور</option>
                        <option value="West Darfur">غرب دارفور</option>
                        <option value="Sennar">سنار</option>
                        <option value="White Nile">النيل الأبيض</option>
                        <option value="Blue Nile">النيل الأزرق</option>
                    </select>
                </div> 
                <div class="form-field checkout-form-field">
                    <i class="fa fa-map-marker-alt"></i>
                    <input required class="form-control" type="text" name="city" placeholder="المدينة">
                </div>
                <div class="form-field checkout-form-field">
                    <i class="fa fa-road"></i>
                    <input required class="form-control" type="text" name="street" placeholder="اسم شارع المنزل">
                </div>
                <div class="form-field checkout-form-field">
                    <i class="fa fa-home"></i>
                    <input required class="form-control" type="text" name="address" placeholder="العنوان">
                </div>
            </div>

            <input id="form-button" class="btn btn-success
            btn-block" type="submit" value="متابعة عملية الشراء">
        </form>
    </div>
</div>

{% endblock content %}
